[project]
name = "mcp-genelab"
version = "0.5.0"
description = "MCP server for querying the NASA GeneLab Knowledge Graph with specialist tools for differential gene expression, DNA methylation, and organism abundance analyses (per-assay and cross-assay), plus DE/DM overlap detection, volcano and Venn plotting, and resource-based plot delivery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
keywords = ["mcp", "NASA", "GeneLab", "OSDR", "proto-okn"]
authors = [
    { name = "Peter W Rose", email = "pwrose.ucsd@gmail.com" },
]
dependencies = [
    "mcp>=1.6.0",
    "neo4j>=5.26.0",
    "pydantic>=2.10.1",
    "numpy",
    "matplotlib",
    "matplotlib-venn",
    "adjustText",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/sbl-sdsc/mcp-genelab"
Repository = "https://github.com/sbl-sdsc/mcp-genelab"
Issues = "https://github.com/sbl-sdsc/mcp-genelab/issues"

[project.scripts]
mcp-genelab = "mcp_genelab.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_genelab"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
