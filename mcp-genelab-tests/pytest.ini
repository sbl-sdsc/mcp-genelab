[pytest]
# Discover tests under tests/ only — don't accidentally collect anything
# under the package itself (e.g. server.py's example docstrings).
testpaths = tests

# Verbose by default; short tracebacks keep failures readable in CI logs.
addopts =
    -v
    --tb=short
    --strict-markers

# Treat the tests/ directory as a Python package by way of the conftest.py
# at the root of testpaths. (We don't need an __init__.py since pytest's
# rootdir-mode handles it.)
python_files = test_*.py
python_classes = Test*
python_functions = test_*
