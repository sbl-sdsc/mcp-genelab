name: Tests

# Run on every push to any branch and every PR. Tests are fast (~10 s on
# a typical runner) so there's no reason to gate by branch or path.
on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the whole matrix on first failure — we want to know if
      # the suite breaks on one Python version but not another.
      fail-fast: false
      matrix:
        # 3.10 is the floor (uses str | None in some type hints). 3.12 is
        # what most current dev environments and the AgentCore runtime use.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Cache pip packages between runs to keep CI fast.
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run pytest
        run: |
          pytest

      # Optional: upload pytest output as an artifact when a job fails so
      # maintainers can read it without re-running locally.
      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            pytest.log
          if-no-files-found: ignore
